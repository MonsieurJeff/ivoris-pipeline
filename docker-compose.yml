# SQL Server 2019 for Ivoris Database
# Usage: docker-compose up -d

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    platform: linux/amd64  # Rosetta for Apple Silicon
    container_name: ivoris-sqlserver
    user: root  # Required for Apple Silicon volume permissions
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - ./data/input:/var/opt/mssql/backup
      - sqlserver_data:/var/opt/mssql/data
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "YourStrong@Passw0rd" -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sqlserver_data:
